<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Ping Pong</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main class="game-container">
        <h1>Ping_Pong</h1>

        <div class="scoreboard">
            <div>
                <span>PLAYER</span>
                <h2 id="playerScore">0</h2>
            </div>
            <div>
                <span>Computer</span>
                <h2 id="computerScore">0</h2>
            </div>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            <section
                id="gameOverOverlay"
                class="game-over-overlay"
                role="dialog"
                aria-modal="true"
                aria-labelledby="gameOverTitle"
                aria-describedby="gameOverWinner finalScore gameOverMessage"
                hidden
            >
                <div class="game-over-card">
                    <p class="game-over-eyebrow">MATCH COMPLETE</p>
                    <h2 id="gameOverTitle">GAME OVER</h2>
                    <p id="gameOverWinner" class="game-over-winner"></p>
                    <p class="final-score-label">FINAL SCORE</p>
                    <p id="finalScore" class="final-score"></p>
                    <p id="gameOverMessage" class="game-over-message"></p>
                    <button id="playAgainButton" class="play-again-button" type="button">
                        PLAY AGAIN
                    </button>
                </div>
            </section>
        </div>
        <p class="controls">
            W - Move Up | S - Move Down 
        </p>
    </main>

   

    <script src="script.js"></script>
</body>
    
</html>
